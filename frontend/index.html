<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <!-- 這個路徑要對應到 public/ 底下真實存在的檔案，Vite 才會自動補上 base（/RUNKU/）。
         指到不存在的檔案時 Vite 不會改寫，路徑就會逃出 base 指到網站根目錄，
         在 GitHub Pages 的專案頁面下 404。不要改用 %BASE_URL%，dev 會再補一次變成 /RUNKU/RUNKU/。 -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="RUNKU - 智慧語言學習平台，透過間隔重複、語音練習和趣味遊戲，讓學習更有效率" />
    <title>RUNKU - 智慧語言學習平台</title>
    
    <!-- GitHub Pages SPA 路由支援 -->
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
