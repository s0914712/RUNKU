<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#7C3AED" />
  <title>RUNKU 單字遊戲樂園 🎮</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --purple: #7C3AED;
      --purple-dark: #6D28D9;
      --pink: #EC4899;
      --blue: #3B82F6;
      --green: #10B981;
      --green-dark: #059669;
      --orange: #F59E0B;
      --red: #EF4444;
      --cyan: #06B6D4;
      --bg: #FDF4FF;
      --card: #FFFFFF;
      --text: #1F2937;
      --text-light: #6B7280;
      --shadow: 0 6px 20px rgba(124, 58, 237, 0.12);
      --shadow-lg: 0 12px 32px rgba(124, 58, 237, 0.18);
      --radius: 20px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', Roboto, sans-serif;
      background: linear-gradient(160deg, #FDF4FF 0%, #EFF6FF 50%, #F0FDFA 100%);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }

    /* ===== TOP BAR ===== */
    .topbar {
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(10px);
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      position: sticky; top: 0; z-index: 100;
    }
    .topbar-inner {
      max-width: 900px; margin: 0 auto; height: 62px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; gap: 10px;
    }
    .logo {
      font-size: 20px; font-weight: 900; color: var(--purple);
      display: flex; align-items: center; gap: 6px; cursor: pointer;
      background: none; border: none; font-family: inherit;
    }
    .topbar-right { display: flex; align-items: center; gap: 8px; }
    .who-chip {
      background: #EEF2FF; border: 2px solid #C7D2FE; border-radius: 999px;
      padding: 6px 12px; font-size: 14px; font-weight: 800; cursor: pointer;
      font-family: inherit; color: var(--text); display: flex; align-items: center; gap: 4px;
      transition: transform .15s;
    }
    .who-chip:active { transform: scale(0.94); }

    /* ===== 入口：選使用者 ===== */
    .who-grid { display: grid; gap: 16px; grid-template-columns: 1fr; max-width: 460px; margin: 0 auto; }
    .who-card {
      background: var(--card); border: none; border-radius: var(--radius);
      padding: 24px 20px; cursor: pointer; box-shadow: var(--shadow);
      font-family: inherit; color: var(--text); text-align: left;
      display: flex; align-items: center; gap: 18px;
      position: relative; overflow: hidden; transition: transform .18s, box-shadow .18s;
    }
    .who-card::before {
      content: ''; position: absolute; inset: 0 auto 0 0; width: 8px; background: var(--accent);
    }
    .who-card:active { transform: scale(0.97); box-shadow: var(--shadow-lg); }
    .who-card .wc-emoji { font-size: 54px; line-height: 1; flex: none; }
    .who-card .wc-name { font-size: 26px; font-weight: 900; }
    .who-card .wc-sub { font-size: 13px; color: var(--text-light); font-weight: 700; margin-top: 3px; }
    .who-card .wc-meta { font-size: 13px; font-weight: 800; color: var(--accent); margin-top: 7px; }
    .who-card .wc-go { margin-left: auto; font-size: 26px; color: var(--accent); flex: none; }
    .star-badge {
      background: linear-gradient(135deg, #FDE68A, #F59E0B);
      color: #78350F; font-weight: 800; font-size: 15px;
      padding: 7px 14px; border-radius: 999px;
      display: flex; align-items: center; gap: 5px;
      box-shadow: 0 3px 10px rgba(245, 158, 11, 0.35);
    }
    .icon-btn {
      background: #F3F4F6; border: none; cursor: pointer;
      width: 40px; height: 40px; border-radius: 12px;
      font-size: 19px; display: grid; place-items: center;
      transition: transform .15s, background .15s;
    }
    .icon-btn:active { transform: scale(0.92); background: #E5E7EB; }

    /* ===== LAYOUT ===== */
    .container { max-width: 900px; margin: 0 auto; padding: 20px 16px 80px; }
    .hidden { display: none !important; }

    /* ===== HOME ===== */
    .hero { text-align: center; padding: 20px 0 26px; }
    .hero-emoji { font-size: 60px; line-height: 1; animation: bob 2.6s ease-in-out infinite; display: inline-block; }
    @keyframes bob { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-10px) rotate(3deg); } }
    .hero h1 { font-size: 30px; font-weight: 900; margin: 10px 0 6px; }
    .hero h1 span { background: linear-gradient(90deg, var(--purple), var(--pink)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .hero p { color: var(--text-light); font-size: 15px; font-weight: 600; }

    .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 26px; }
    .stat {
      background: var(--card); border-radius: 16px; padding: 14px 8px;
      text-align: center; box-shadow: var(--shadow);
    }
    .stat .num { font-size: 24px; font-weight: 900; color: var(--purple); }
    .stat .lbl { font-size: 12px; color: var(--text-light); font-weight: 700; margin-top: 3px; }

    .section-title {
      font-size: 19px; font-weight: 900; margin: 0 0 14px;
      display: flex; align-items: center; gap: 8px;
    }

    .game-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .game-card {
      background: var(--card); border: none; border-radius: var(--radius);
      padding: 20px 14px; cursor: pointer; text-align: center;
      box-shadow: var(--shadow); transition: transform .18s, box-shadow .18s;
      font-family: inherit; color: var(--text);
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      position: relative; overflow: hidden;
    }
    .game-card::after {
      content: ''; position: absolute; inset: 0 0 auto 0; height: 6px;
      background: var(--accent, var(--purple));
    }
    .game-card:active { transform: scale(0.96); box-shadow: var(--shadow-lg); }
    .game-card .ge { font-size: 40px; }
    .game-card .gt { font-size: 16px; font-weight: 800; }
    .game-card .gd { font-size: 12px; color: var(--text-light); font-weight: 600; line-height: 1.5; }

    /* ===== BUTTONS ===== */
    .btn {
      border: none; cursor: pointer; font-family: inherit;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      color: #fff; font-weight: 800; font-size: 17px;
      padding: 15px 28px; border-radius: 999px;
      box-shadow: 0 6px 18px rgba(124, 58, 237, 0.35);
      transition: transform .15s;
    }
    .btn:active { transform: scale(0.95); }
    .btn.secondary {
      background: var(--card); color: var(--purple);
      box-shadow: var(--shadow); border: 2px solid #EDE9FE;
    }
    .btn.green { background: linear-gradient(135deg, #34D399, var(--green-dark)); box-shadow: 0 6px 18px rgba(16,185,129,.35); }
    .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 22px; }

    /* ===== CATEGORY CHIPS ===== */
    .chips { display: flex; flex-wrap: wrap; gap: 9px; justify-content: center; margin-bottom: 22px; }
    .chip {
      background: var(--card); border: 2px solid #E9D5FF; border-radius: 999px;
      padding: 10px 16px; font-size: 14px; font-weight: 800; cursor: pointer;
      font-family: inherit; color: var(--text); transition: all .15s;
      display: flex; align-items: center; gap: 5px;
    }
    .chip:active { transform: scale(0.94); }
    .chip.on { background: linear-gradient(135deg, var(--purple), var(--pink)); color: #fff; border-color: transparent; }

    /* ===== PANEL / CARD ===== */
    .panel {
      background: var(--card); border-radius: var(--radius);
      padding: 24px 18px; box-shadow: var(--shadow); text-align: center;
    }
    .setup-title { font-size: 24px; font-weight: 900; margin-bottom: 6px; }
    .setup-sub { color: var(--text-light); font-size: 14px; font-weight: 600; margin-bottom: 22px; line-height: 1.7; }

    /* ===== 遊戲設定（停留秒數／難度） ===== */
    .settings {
      background: #FAF5FF; border-radius: 16px; padding: 18px 14px;
      margin: 4px 0 22px; border: 2px solid #F3E8FF;
    }
    .set-title { font-size: 16px; font-weight: 900; margin-bottom: 4px; }
    .set-value { font-size: 32px; font-weight: 900; color: var(--purple); margin-bottom: 10px; }
    .set-hint { font-size: 13px; color: var(--text-light); font-weight: 700; line-height: 1.6; }
    .range-row { display: flex; align-items: center; gap: 12px; justify-content: center; }
    .range-btn {
      flex: none; width: 46px; height: 46px; border-radius: 14px; border: none; cursor: pointer;
      background: #EDE9FE; color: var(--purple); font-size: 26px; font-weight: 900;
      font-family: inherit; line-height: 1; transition: transform .15s;
    }
    .range-btn:active { transform: scale(0.9); background: #DDD6FE; }
    .big-range {
      -webkit-appearance: none; appearance: none; flex: 1; max-width: 260px;
      height: 14px; border-radius: 999px; background: #E9D5FF; outline: none; cursor: pointer;
    }
    .big-range::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none; width: 34px; height: 34px; border-radius: 50%;
      background: linear-gradient(135deg, var(--purple), var(--pink)); cursor: pointer;
      box-shadow: 0 3px 10px rgba(124, 58, 237, .45);
    }
    .big-range::-moz-range-thumb {
      width: 34px; height: 34px; border: none; border-radius: 50%;
      background: linear-gradient(135deg, var(--purple), var(--pink)); cursor: pointer;
    }
    .range-scale {
      display: flex; justify-content: space-between; max-width: 260px; margin: 6px auto 0;
      font-size: 11px; font-weight: 800; color: var(--text-light); text-align: center; line-height: 1.4;
    }

    /* ===== GAME HUD ===== */
    .hud {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; margin-bottom: 16px;
    }
    .hud-pill {
      background: var(--card); border-radius: 999px; padding: 8px 15px;
      font-weight: 800; font-size: 14px; box-shadow: var(--shadow);
      display: flex; align-items: center; gap: 5px;
    }
    .progress-bar { height: 12px; background: #EDE9FE; border-radius: 999px; overflow: hidden; margin-bottom: 18px; }
    .progress-fill {
      height: 100%; background: linear-gradient(90deg, var(--purple), var(--pink));
      border-radius: 999px; transition: width .35s ease;
    }

    /* ===== QUESTION CARD ===== */
    .q-card {
      background: var(--card); border-radius: var(--radius); padding: 26px 18px;
      text-align: center; box-shadow: var(--shadow); margin-bottom: 18px;
    }
    .q-emoji { font-size: 66px; line-height: 1.1; animation: pop .35s ease; }
    @keyframes pop { 0% { transform: scale(.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .q-zh { font-size: 34px; font-weight: 900; margin-top: 8px; }
    .q-hint { color: var(--text-light); font-size: 13px; font-weight: 700; margin-top: 8px; }

    .options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .opt {
      background: var(--card); border: 3px solid transparent; border-radius: 16px;
      padding: 20px 10px; font-size: 20px; font-weight: 800; cursor: pointer;
      font-family: inherit; color: var(--text); box-shadow: var(--shadow);
      transition: transform .12s; word-break: break-word;
    }
    .opt:active { transform: scale(0.96); }
    .opt.right { background: #D1FAE5; border-color: var(--green); color: var(--green-dark); }
    .opt.wrong { background: #FEE2E2; border-color: var(--red); color: #B91C1C; animation: shake .4s; }
    .opt:disabled { cursor: default; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }

    .speak-big {
      width: 120px; height: 120px; border-radius: 50%; border: none; cursor: pointer;
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      color: #fff; font-size: 52px; margin: 6px auto 4px; display: grid; place-items: center;
      box-shadow: 0 8px 24px rgba(6, 182, 212, .4); transition: transform .15s;
      animation: ring 2s ease-in-out infinite;
    }
    .speak-big:active { transform: scale(0.92); }
    @keyframes ring { 0%,100%{ box-shadow: 0 8px 24px rgba(6,182,212,.4);} 50%{ box-shadow: 0 8px 34px rgba(6,182,212,.7);} }

    /* ===== MEMORY ===== */
    .mem-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; }
    .mem-card {
      aspect-ratio: 3/4; border: none; border-radius: 14px; cursor: pointer;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      color: #fff; font-size: 15px; font-weight: 800; font-family: inherit;
      display: grid; place-items: center; padding: 4px; text-align: center;
      box-shadow: var(--shadow); transition: transform .2s; word-break: break-word;
      line-height: 1.25;
    }
    .mem-card .back-face { font-size: 30px; }
    .mem-card.open { background: #fff; color: var(--text); border: 3px solid var(--purple); }
    .mem-card.done { background: #D1FAE5; color: var(--green-dark); border: 3px solid var(--green); opacity: .65; }
    .mem-card:active { transform: scale(0.94); }

    /* ===== WHACK ===== */
    /* 整個畫面塞進一個視窗高度，九個洞不用捲動就看得到 */
    body.whack-mode .container { padding: 12px 12px 12px; }
    .whack-screen {
      display: flex; flex-direction: column; gap: 10px;
      height: calc(100dvh - 62px - 24px); min-height: 460px;
    }
    .whack-target {
      background: var(--card); border-radius: 16px; padding: 10px 12px;
      text-align: center; box-shadow: var(--shadow); flex: none;
    }
    .whack-target .q-hint { margin-top: 0; font-size: 12px; }
    .whack-target .zh { font-size: clamp(26px, 7vw, 36px); font-weight: 900; line-height: 1.25; }
    .whack-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
      gap: 8px; flex: 1; min-height: 0;
    }
    .hole {
      border-radius: 18px; position: relative; overflow: hidden; min-height: 0;
      background: radial-gradient(ellipse at 50% 85%, #A78BFA 0%, #EDE9FE 70%);
      display: grid; place-items: end center; padding-bottom: 5px;
    }
    .mole {
      width: 94%; border: none; border-radius: 14px; cursor: pointer;
      background: linear-gradient(135deg, #FBBF24, #F59E0B);
      color: #78350F; font-weight: 900; font-size: clamp(19px, 5.2vw, 26px); font-family: inherit;
      padding: 12px 2px; box-shadow: 0 4px 0 #B45309;
      transform: translateY(130%); transition: transform .3s cubic-bezier(.34,1.4,.64,1);
      overflow-wrap: anywhere; line-height: 1.15;
    }
    .mole.up { transform: translateY(0); }
    .mole:active { transform: translateY(6px); }
    .mole.hit { background: linear-gradient(135deg, #34D399, var(--green-dark)); color: #fff; box-shadow: 0 4px 0 #047857; }
    .mole.miss { background: linear-gradient(135deg, #F87171, #DC2626); color: #fff; box-shadow: 0 4px 0 #991B1B; }

    /* ===== SPELLING ===== */
    .slots { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; margin: 18px 0 6px; min-height: 58px; }
    .slot {
      width: 44px; height: 54px; border-radius: 12px; background: #F5F3FF;
      border: 3px dashed #C4B5FD; display: grid; place-items: center;
      font-size: 24px; font-weight: 900; color: var(--purple);
    }
    .slot.filled { background: #fff; border-style: solid; border-color: var(--purple); }
    .slot.ok { background: #D1FAE5; border-color: var(--green); color: var(--green-dark); }
    .slot.no { background: #FEE2E2; border-color: var(--red); color: #B91C1C; animation: shake .4s; }
    .tiles { display: flex; flex-wrap: wrap; gap: 9px; justify-content: center; margin-top: 8px; }
    .tile {
      width: 50px; height: 56px; border-radius: 12px; border: none; cursor: pointer;
      background: linear-gradient(135deg, #A78BFA, var(--purple)); color: #fff;
      font-size: 24px; font-weight: 900; font-family: inherit;
      box-shadow: 0 4px 0 var(--purple-dark); transition: transform .12s;
    }
    .tile:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--purple-dark); }
    .tile.used { visibility: hidden; }

    /* ===== WORD LIST ===== */
    .word-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 12px; }
    .word-card {
      background: var(--card); border-radius: 16px; padding: 14px 12px;
      box-shadow: var(--shadow); text-align: center; cursor: pointer;
      transition: transform .15s; border: none; font-family: inherit; color: var(--text);
    }
    .word-card:active { transform: scale(0.96); }
    .word-card { position: relative; }
    .word-card .wno {
      position: absolute; top: 7px; left: 9px; font-size: 11px; font-weight: 900;
      color: #A78BFA; letter-spacing: .5px;
    }
    .word-card .we { font-size: 34px; }
    .word-card .wen { font-size: 18px; font-weight: 800; margin-top: 4px; }
    .word-card .wzh { font-size: 14px; color: var(--text-light); font-weight: 700; }
    .word-card .wnote { font-size: 11px; color: var(--orange); font-weight: 800; margin-top: 4px; }
    .word-card .wstars { font-size: 12px; margin-top: 5px; letter-spacing: 1px; }

    /* ===== RESULT ===== */
    .result-emoji { font-size: 76px; animation: pop .5s ease; }
    .result-score { font-size: 44px; font-weight: 900; color: var(--purple); margin: 6px 0; }
    .result-line { font-size: 16px; font-weight: 700; color: var(--text-light); line-height: 1.9; }
    .earned { display: inline-block; background: #FEF3C7; color: #92400E; font-weight: 900;
      padding: 8px 18px; border-radius: 999px; margin-top: 14px; font-size: 17px; }

    /* ===== CONFETTI ===== */
    .confetti {
      position: fixed; top: -50px; font-size: 26px; z-index: 999;
      pointer-events: none; animation: fall linear forwards;
    }
    @keyframes fall { to { transform: translateY(105vh) rotate(540deg); opacity: .2; } }

    .toast {
      position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
      background: rgba(31,41,55,.94); color: #fff; font-weight: 800; font-size: 15px;
      padding: 12px 22px; border-radius: 999px; z-index: 500; animation: toastIn .3s ease;
    }
    @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 16px); } }

    @media (max-width: 420px) {
      .stats-row { grid-template-columns: repeat(2, 1fr); }
      .q-zh { font-size: 28px; }
      .opt { font-size: 17px; padding: 17px 8px; }
      .mem-grid { gap: 7px; }
      .mem-card { font-size: 13px; }
      .tile { width: 44px; height: 50px; font-size: 21px; }
      .slot { width: 38px; height: 48px; font-size: 21px; }
    }
  </style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <button class="logo" onclick="go('home')">🎮 RUNKU</button>
    <div class="topbar-right" id="topbar-right" style="visibility:hidden">
      <button class="who-chip" id="who-chip" onclick="go('entry')" title="換人玩"></button>
      <div class="star-badge">⭐ <span id="star-count">0</span></div>
      <button class="icon-btn" onclick="go('home')" title="回首頁">🏠</button>
    </div>
  </div>
</header>

<main id="app" class="container"></main>

<script>
/* =========================================================
   RUNKU 單字遊戲樂園
   單字來源：20260729 U6~U10 英文聽寫表
   ========================================================= */

/* ===== 1. 單字資料 ===== */
const CATS_MEI = {
  basics:   { label: '基礎用語',    emoji: '✨',   color: '#8B5CF6' },
  animals:  { label: '動物',        emoji: '🦁',   color: '#F59E0B' },
  things:   { label: '生活物品',    emoji: '🪁',   color: '#3B82F6' },
  people:   { label: '職業人物',    emoji: '👩‍⚕️', color: '#EC4899' },
  vehicles: { label: '交通與樂器',  emoji: '🚂',   color: '#10B981' },
  numbers:  { label: '數字 1-10',   emoji: '🔢',   color: '#EF4444' },
  body:     { label: '身體部位',    emoji: '✋',   color: '#06B6D4' },
};

const WORDS_MEI = [
  { id:1,  en:'what',     zh:'什麼',   cat:'basics', emoji:'❓' },
  { id:2,  en:'this',     zh:'這個',   cat:'basics', emoji:'👉' },
  { id:3,  en:'that',     zh:'那個',   cat:'basics', emoji:'👈' },
  { id:4,  en:'these',    zh:'這些',   cat:'basics', emoji:'👐' },
  { id:5,  en:'those',    zh:'那些',   cat:'basics', emoji:'🙌' },
  { id:6,  en:'flower',   zh:'花',     cat:'basics', emoji:'🌸' },

  { id:7,  en:'bear',     zh:'熊',     cat:'animals', emoji:'🐻' },
  { id:8,  en:'bird',     zh:'鳥',     cat:'animals', emoji:'🐦' },
  { id:9,  en:'tiger',    zh:'老虎',   cat:'animals', emoji:'🐯' },
  { id:10, en:'ant',      zh:'螞蟻',   cat:'animals', emoji:'🐜' },
  { id:11, en:'zebra',    zh:'斑馬',   cat:'animals', emoji:'🦓' },
  { id:12, en:'octopus',  zh:'章魚',   cat:'animals', emoji:'🐙' },
  { id:13, en:'horse',    zh:'馬',     cat:'animals', emoji:'🐴' },

/* ===== 2. 進度儲存（每個使用者一份，互不影響） ===== */
const DEFAULT_SETTINGS = { whackSec: 5, whackDiff: 'normal' };
let STORE_KEY = null;
let store = emptyStore();

function emptyStore() {
  return { stars: 0, words: {}, best: { whack: {} }, settings: Object.assign({}, DEFAULT_SETTINGS) };
}
function loadStore(key) {
  try {
    const raw = JSON.parse(localStorage.getItem(key) || '{}');
    const best = (raw.best && typeof raw.best === 'object') ? raw.best : {};
    /* 舊版把打地鼠紀錄存成單一數字，轉成依難度分開存 */
    if (typeof best.whack === 'number') best.whack = { normal: best.whack };
    if (!best.whack || typeof best.whack !== 'object') best.whack = {};
    return {
      stars: raw.stars || 0,
      words: raw.words || {},
      best,
      settings: Object.assign({}, DEFAULT_SETTINGS, raw.settings || {}),
    };
  } catch {
    return emptyStore();
  }
}
function saveStore() {
  if (STORE_KEY) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch {}
  }
  document.getElementById('star-count').textContent = store.stars;
}
/* 讀某個使用者的星星數（入口畫面用，不會切換目前使用者） */
function starsOf(profileKey) {
  try { return JSON.parse(localStorage.getItem(PROFILES[profileKey].storeKey) || '{}').stars || 0; }
  catch { return 0; }
}
function addStars(n) { store.stars += n; saveStore(); }

function recordAnswer(id, ok) {
  const w = store.words[id] || { c: 0, w: 0 };
  if (ok) w.c++; else w.w++;
  store.words[id] = w;
  saveStore();
}
/* 熟練度 0~3 顆星：答對越多顆數越高，答錯會扣分 */
function masteryOf(id) {
  const w = store.words[id];
  if (!w) return 0;
  const score = w.c - w.w;
  if (score >= 6) return 3;
  if (score >= 3) return 2;
  if (score >= 1) return 1;
  return 0;
}
function masteredCount() { return WORDS.filter(w => masteryOf(w.id) >= 3).length; }
function learningCount() { return WORDS.filter(w => masteryOf(w.id) > 0 && masteryOf(w.id) < 3).length; }

/* ===== 3. 工具 ===== */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function wordsOf(cat) { return cat === 'all' ? WORDS.slice() : WORDS.filter(w => w.cat === cat); }
function pickDistractors(word, n, cat) {
  let pool = wordsOf(cat).filter(w => w.id !== word.id);
  if (pool.length < n) pool = WORDS.filter(w => w.id !== word.id);
  return shuffle(pool).slice(0, n);
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }

/* 英文發音 */
function speak(text, rate = 0.8) {
  if (!window.speechSynthesis) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = rate;
    u.pitch = 1.1;
    speechSynthesis.speak(u);
  } catch {}
}

/* 音效 */
let audioCtx = null;
function tone(freq, start, dur, vol = 0.15) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime + start;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur);
  } catch {}
}
const sfx = {
  right() { tone(880, 0, .12); tone(1320, .1, .18); },
  wrong() { tone(200, 0, .22, .12); },
  pop()   { tone(660, 0, .07, .1); },
  win()   { [523,659,784,1047].forEach((f, i) => tone(f, i * .11, .22)); },
};

function confetti() {
  const emojis = ['🎉','⭐','🌟','🎊','✨','🏆'];
  for (let i = 0; i < 26; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.animationDuration = (1.6 + Math.random() * 1.4) + 's';
    el.style.animationDelay = (Math.random() * .5) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3600);
  }
}
function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1600);
}

const app = document.getElementById('app');
let timers = [];
function later(fn, ms) { const t = setTimeout(fn, ms); timers.push(t); return t; }
function every(fn, ms) { const t = setInterval(fn, ms); timers.push(t); return t; }
function clearTimers() { timers.forEach(t => { clearTimeout(t); clearInterval(t); }); timers = []; }

function render(html) {
  document.body.classList.remove('whack-mode');
  app.innerHTML = html;
  window.scrollTo(0, 0);
}

        <button class="range-btn" onclick="bumpSec(-1)" aria-label="減少一秒">−</button>
        <input type="range" class="big-range" id="sec-range" min="1" max="10" step="1"
               value="${s.whackSec}" oninput="setSec(this.value)" aria-label="圖卡停留秒數">
        <button class="range-btn" onclick="bumpSec(1)" aria-label="增加一秒">＋</button>
      </div>
      <div class="range-scale"><span>1 秒<br>快</span><span>10 秒<br>慢</span></div>

      <div class="set-title" style="margin-top:20px">🎚️ 難度</div>
      <div class="chips" id="diff-chips" style="margin-bottom:8px">
        ${Object.entries(DIFF).map(([k, d]) =>
          `<button class="chip ${s.whackDiff === k ? 'on' : ''}" data-diff="${k}" onclick="pickDiff(this)">${d.stars} ${d.label}</button>`
        ).join('')}
      </div>
      <div class="set-hint" id="diff-hint">${DIFF[s.whackDiff].hint}</div>
    </div>
  `;
}
function setSec(v) {
  /* 注意：不能用 `Number(v) || 5`，因為 0 是 falsy 會跳回 5 而不是夾到 1 */
  let n = Math.round(Number(v));
  if (!Number.isFinite(n)) n = DEFAULT_SETTINGS.whackSec;
  n = Math.min(10, Math.max(1, n));
  store.settings.whackSec = n;
  saveStore();
  const label = document.getElementById('sec-val');
  if (label) label.textContent = n;
}
function bumpSec(d) {
  setSec(store.settings.whackSec + d);
  const range = document.getElementById('sec-range');
  if (range) range.value = store.settings.whackSec;
  sfx.pop();
}
function pickDiff(btn) {
  document.querySelectorAll('#diff-chips .chip').forEach(c => c.classList.remove('on'));
  btn.classList.add('on');
  store.settings.whackDiff = btn.dataset.diff;
  saveStore();
  const hint = document.getElementById('diff-hint');
  if (hint) hint.textContent = DIFF[btn.dataset.diff].hint;
  sfx.pop();
}
function pickCat(btn) {
  document.querySelectorAll('#cat-chips .chip').forEach(c => c.classList.remove('on'));
  btn.classList.add('on');
  currentCat = btn.dataset.cat;
  sfx.pop();
}
function startGame(key) {
  clearTimers();
  const starters = { quiz: startQuiz, listen: startListen, memory: startMemory, whack: startWhack, spell: startSpell };
  starters[key](currentCat);
}

/* ===== 7. 結算畫面 ===== */

      <div class="btn-row">
        <button class="btn" onclick="startGame('${gameKey}')">再玩一次 🔁</button>
        <button class="btn secondary" onclick="go('setup','${gameKey}')">換主題</button>
        <button class="btn secondary" onclick="go('home')">回首頁 🏠</button>

}

/* ===== 8. 遊戲一：快問快答（看中文選英文） ===== */

function startQuiz(cat) {

  quiz = { cat, list: shuffle(pool).slice(0, Math.min(10, pool.length)), i: 0, right: 0, locked: false };
  renderQuizQ();
}
function renderQuizQ() {
  const w = quiz.list[quiz.i];
  const opts = shuffle([w, ...pickDistractors(w, 3, quiz.cat)]);
  quiz.locked = false;
  render(`
    <div class="hud">
      <div class="hud-pill">📝 ${quiz.i + 1} / ${quiz.list.length}</div>
      <div class="hud-pill">✅ 答對 ${quiz.right}</div>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${(quiz.i / quiz.list.length) * 100}%"></div></div>
    <div class="q-card">
      <div class="q-emoji">${w.emoji}</div>
      <div class="q-zh">${w.zh}</div>

function answerQuiz(btn, ok) {

    quiz.i++;

    else renderQuizQ();

}
function finishQuiz() {

  const pct = Math.round(r / n * 100);
  renderResult({
    emoji: pct === 100 ? '🏆' : pct >= 70 ? '🎉' : '💪',
    title: pct === 100 ? '全部答對，太厲害了！' : pct >= 70 ? '答得很好喔！' : '再練習一次會更棒！',
    score: `${r} / ${n}`,

}

/* ===== 10. 遊戲三：記憶翻牌 ===== */
let memory = null;

function startMemory(cat) {
  const pool = wordsOf(cat);
  const pairs = shuffle(pool).slice(0, Math.min(6, pool.length));
  const cards = shuffle(pairs.flatMap(w => [
    { key: `${w.id}-en`, id: w.id, face: w.en, type: 'en' },
    { key: `${w.id}-zh`, id: w.id, face: `${w.emoji}<br>${w.zh}`, type: 'zh' },
  ]));
  memory = { cat, cards, open: [], matched: 0, moves: 0, pairs: pairs.length, lock: false, start: Date.now() };
  renderMemory();
}
function renderMemory() {
  render(`
    <div class="hud">
      <div class="hud-pill">🎴 配對 ${memory.matched} / ${memory.pairs}</div>
      <div class="hud-pill">🔁 翻牌 ${memory.moves}</div>
    </div>
    <div class="mem-grid" id="mem-grid">
      ${memory.cards.map((c, i) => `
        <button class="mem-card" id="mc-${i}" onclick="flipCard(${i})"><span class="back-face">❔</span></button>
      `).join('')}
    </div>
    <div class="btn-row"><button class="btn secondary" onclick="go('setup','memory')">← 重新選主題</button></div>
  `);
}
function flipCard(i) {
  if (memory.lock) return;
  const card = memory.cards[i];
  const el = document.getElementById('mc-' + i);
  if (!el || el.classList.contains('done') || el.classList.contains('open')) return;

  el.classList.add('open');
  el.innerHTML = card.face;
  sfx.pop();
  if (card.type === 'en') speak(card.face);
  memory.open.push(i);

  if (memory.open.length < 2) return;

  memory.moves++;
  const [a, b] = memory.open;
  const ca = memory.cards[a], cb = memory.cards[b];
  memory.lock = true;

  if (ca.id === cb.id) {
    const w = WORDS.find(x => x.id === ca.id);
    speak(w.en);
    sfx.right();
    recordAnswer(ca.id, true);
    later(() => {
      document.getElementById('mc-' + a).classList.add('done');
      document.getElementById('mc-' + b).classList.add('done');
      memory.matched++;
      memory.open = [];
      memory.lock = false;
      updateMemHud();
      if (memory.matched === memory.pairs) finishMemory();
    }, 500);
  } else {
    sfx.wrong();
    later(() => {
      [a, b].forEach(idx => {
        const e = document.getElementById('mc-' + idx);
        if (e) { e.classList.remove('open'); e.innerHTML = '<span class="back-face">❔</span>'; }
      });
      memory.open = [];
      memory.lock = false;
      updateMemHud();
    }, 1000);
  }
}
function updateMemHud() {
  const pills = document.querySelectorAll('.hud-pill');
  if (pills[0]) pills[0].textContent = `🎴 配對 ${memory.matched} / ${memory.pairs}`;
  if (pills[1]) pills[1].textContent = `🔁 翻牌 ${memory.moves}`;
}
function finishMemory() {
  const secs = Math.round((Date.now() - memory.start) / 1000);
  const perfect = memory.pairs;
  const bonus = Math.max(0, (perfect * 2 - memory.moves)) * 10;
  later(() => renderResult({
    emoji: '🎴',
    title: '全部配對成功！',
    score: `${secs} 秒`,
    lines: [`翻牌 ${memory.moves} 次（最少 ${perfect} 次）`, bonus > 0 ? '記憶力加分獎勵！' : '再快一點就更棒了！'],
    stars: memory.pairs * 20 + bonus,
    gameKey: 'memory',
    cat: memory.cat,
  }), 600);
}

/* ===== 11. 遊戲四：打地鼠 ===== */
let whack = null;

/* 難度設定：地鼠數量越多越難，困難模式的提示不給圖示 */
const DIFF = {
  easy:   { label:'簡單', stars:'⭐',     moles:3, showEmoji:true,  perHit:10, time:60,
            hint:'3 個地鼠，題目有圖示提示' },
  normal: { label:'普通', stars:'⭐⭐',   moles:4, showEmoji:true,  perHit:15, time:60,
            hint:'4 個地鼠，題目有圖示提示' },
  hard:   { label:'困難', stars:'⭐⭐⭐', moles:6, showEmoji:false, perHit:22, time:60,
            hint:'6 個地鼠，只看中文沒有圖示，星星最多' },
};
const WHACK_GAP_MS = 700;   // 每一輪之間的空檔

function startWhack(cat) {
  const diffKey = DIFF[store.settings.whackDiff] ? store.settings.whackDiff : 'normal';
  const diff = DIFF[diffKey];
  const upMs = Math.min(10, Math.max(1, store.settings.whackSec)) * 1000;
  whack = {
    cat, diffKey, diff, upMs,
    score: 0, hit: 0, miss: 0, time: diff.time, round: 0, target: null, active: false,
  };
  render(`
    <div class="whack-screen">
      <div class="hud" style="margin-bottom:0">
        <div class="hud-pill">⏰ <span id="w-time">${diff.time}</span> 秒</div>
        <div class="hud-pill">🔨 <span id="w-hit">0</span></div>
        <div class="hud-pill">💥 <span id="w-miss">0</span></div>
        <button class="icon-btn" onclick="go('setup','whack')" title="結束遊戲">✖️</button>
      </div>
      <div class="whack-target">
        <div class="q-hint">敲敲看！這個字的英文在哪裡？</div>
        <div class="zh" id="w-target">準備…</div>
      </div>
      <div class="whack-grid" id="w-grid">
        ${Array.from({ length: 9 }, (_, i) => `
          <div class="hole"><button class="mole" id="mole-${i}" onclick="hitMole(${i})"></button></div>
        `).join('')}
      </div>
    </div>
  `);
  document.body.classList.add('whack-mode');
  every(() => {
    whack.time--;
    const el = document.getElementById('w-time');
    if (el) el.textContent = whack.time;
    if (whack.time <= 0) finishWhack();
  }, 1000);
  nextWhackRound();
}
function nextWhackRound() {
  if (whack.time <= 0) return;
  const pool = wordsOf(whack.cat);
  const target = shuffle(pool)[0];
  const count = whack.diff.moles;
  const others = pickDistractors(target, count - 1, whack.cat);
  const holes = shuffle([0,1,2,3,4,5,6,7,8]).slice(0, count);
  const words = shuffle([target, ...others]);

  whack.target = target;
  whack.moles = {};
  whack.active = true;

  const tEl = document.getElementById('w-target');
  if (!tEl) return;
  tEl.textContent = whack.diff.showEmoji ? `${target.emoji} ${target.zh}` : target.zh;

  for (let i = 0; i < 9; i++) {
    const m = document.getElementById('mole-' + i);
    if (!m) continue;
    m.className = 'mole';
    m.textContent = '';
  }
  holes.forEach((h, k) => {
    const m = document.getElementById('mole-' + h);
    if (!m) return;
    m.textContent = words[k].en;
    whack.moles[h] = words[k];
    later(() => m.classList.add('up'), 110 * k);
  });
  sfx.pop();

  later(() => {
    if (whack.active && whack.time > 0) {
      whack.miss++;
      recordAnswer(whack.target.id, false);
      updateWhackHud();
      hideMoles();
      later(nextWhackRound, WHACK_GAP_MS);
    }
  }, whack.upMs);
}
function hideMoles() {
  whack.active = false;
  for (let i = 0; i < 9; i++) {
    const m = document.getElementById('mole-' + i);
    if (m) m.classList.remove('up');
  }
}
function hitMole(i) {
  if (!whack || !whack.active) return;
  const w = whack.moles[i];
  if (!w) return;
  const m = document.getElementById('mole-' + i);
  const ok = w.id === whack.target.id;
  whack.active = false;

  if (ok) {
    m.classList.add('hit');
    whack.hit++; whack.score += whack.diff.perHit;
    sfx.right();
    speak(w.en);
  } else {
    m.classList.add('miss');
    whack.miss++;
    sfx.wrong();
    const right = Object.entries(whack.moles).find(([, x]) => x.id === whack.target.id);
    if (right) {
      const rm = document.getElementById('mole-' + right[0]);
      if (rm) rm.classList.add('hit');
    }
  }
  recordAnswer(whack.target.id, ok);
  updateWhackHud();
  /* 答錯時多停一下，讓小朋友看清楚正確答案 */
  later(() => { hideMoles(); later(nextWhackRound, WHACK_GAP_MS); }, ok ? 700 : 1600);
}
function updateWhackHud() {
  const h = document.getElementById('w-hit'), m = document.getElementById('w-miss');
  if (h) h.textContent = whack.hit;
  if (m) m.textContent = whack.miss;
}
function finishWhack() {
  clearTimers();
  /* 最佳紀錄依難度分開記錄，不同難度不互相比較 */
  const best = store.best.whack[whack.diffKey] || 0;
  const isBest = whack.hit > best;
  if (isBest) { store.best.whack[whack.diffKey] = whack.hit; saveStore(); }
  renderResult({
    emoji: whack.hit >= 15 ? '🏆' : whack.hit >= 8 ? '🔨' : '💪',
    title: isBest ? '破紀錄了！' : '時間到！',
    score: `敲中 ${whack.hit} 個`,
    lines: [
      `敲錯 ${whack.miss} 次`,
      `難度：${whack.diff.stars} ${whack.diff.label}　停留 ${whack.upMs / 1000} 秒`,
      `${whack.diff.label}最佳紀錄：${store.best.whack[whack.diffKey] || whack.hit} 個`,
    ],
    stars: whack.score,
    gameKey: 'whack',
    cat: whack.cat,
  });
}

/* ===== 12. 遊戲五：拼字大師 ===== */
let spell = null;

function startSpell(cat) {
  /* 片語（fly a kite）沒辦法用字母磁磚拼，拼字遊戲只收單一單字 */
  const all = wordsOf(cat);
  const pool = all.filter(w => /^[a-zA-Z]+$/.test(w.en));
  const usable = pool.length ? pool : all;
  spell = { cat, list: shuffle(usable).slice(0, Math.min(8, usable.length)), i: 0, right: 0, typed: [], done: false };
  renderSpellQ();
}
function renderSpellQ() {
  const w = spell.list[spell.i];
  const letters = w.en.split('');
  let tiles = shuffle(letters);
  if (letters.length > 1 && tiles.join('') === w.en) tiles = shuffle(tiles);
  spell.typed = [];
  spell.usedIdx = [];
  spell.tiles = tiles;
  spell.done = false;

  render(`
    <div class="hud">
      <div class="hud-pill">✏️ ${spell.i + 1} / ${spell.list.length}</div>
      <div class="hud-pill">✅ 答對 ${spell.right}</div>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${(spell.i / spell.list.length) * 100}%"></div></div>
    <div class="q-card">
      <div class="q-emoji">${w.emoji}</div>
      <div class="q-zh">${w.zh}</div>
      <div class="q-hint">把字母排成正確的英文單字（${w.en.length} 個字母）</div>
      <div class="slots" id="slots">${renderSlots()}</div>
      <div class="tiles" id="tiles">
        ${tiles.map((ch, i) => `<button class="tile" id="tile-${i}" onclick="tapTile(${i})">${esc(ch)}</button>`).join('')}
      </div>
      <div class="btn-row" style="margin-top:16px">
        <button class="btn secondary" onclick="speak('${esc(w.en)}')">🔊 聽發音</button>
        <button class="btn secondary" onclick="undoTile()">⌫ 刪一個</button>
      </div>
    </div>
  `);
}
function renderSlots(state = '') {
  const w = spell.list[spell.i];
  return w.en.split('').map((_, i) => {
    const ch = spell.typed[i];
    const cls = state ? state : (ch ? 'filled' : '');
    return `<div class="slot ${cls}">${ch ? esc(ch) : ''}</div>`;
  }).join('');
}
function tapTile(i) {
  if (spell.done) return;
  const w = spell.list[spell.i];
  if (spell.typed.length >= w.en.length) return;
  const btn = document.getElementById('tile-' + i);
  if (!btn || btn.classList.contains('used')) return;

  btn.classList.add('used');
  spell.typed.push(spell.tiles[i]);
  spell.usedIdx.push(i);
  sfx.pop();
  document.getElementById('slots').innerHTML = renderSlots();

  if (spell.typed.length === w.en.length) checkSpell();
}
function undoTile() {
  if (spell.done || !spell.typed.length) return;
  spell.typed.pop();
  const i = spell.usedIdx.pop();
  const btn = document.getElementById('tile-' + i);
  if (btn) btn.classList.remove('used');
  document.getElementById('slots').innerHTML = renderSlots();
}
function checkSpell() {
  const w = spell.list[spell.i];
  const answer = spell.typed.join('');
  spell.done = true;
  const ok = answer === w.en;

  document.getElementById('slots').innerHTML = renderSlots(ok ? 'ok' : 'no');
  recordAnswer(w.id, ok);

  if (ok) {
    spell.right++;
    sfx.right();
    speak(w.en);
    later(nextSpell, 1100);
  } else {
    sfx.wrong();
    later(() => {
      spell.typed = w.en.split('');
      document.getElementById('slots').innerHTML = renderSlots('ok');
      speak(w.en);
      later(nextSpell, 1500);
    }, 700);
  }
}
function nextSpell() {
  spell.usedIdx = [];
  spell.i++;
  if (spell.i >= spell.list.length) {
    const n = spell.list.length, r = spell.right;
    renderResult({
      emoji: r === n ? '🏅' : r >= n * 0.7 ? '✏️' : '📝',
      title: r === n ? '拼字全對，超強的！' : r >= n * 0.7 ? '拼得很好喔！' : '慢慢來，會越拼越好！',
      score: `${r} / ${n}`,
      lines: ['把字母排對就是最厲害的拼字大師！'],
      stars: r * 15,
      gameKey: 'spell',
      cat: spell.cat,
    });
  } else {
    renderSpellQ();
  }
}

/* ===== 13. 單字卡 / 單字表 ===== */
function renderCards(cat) {
  const list = wordsOf(cat);
  render(`
    <div class="hero" style="padding:14px 0 18px">
      <div style="font-size:44px">📖</div>
      <h1 style="font-size:24px">單字卡</h1>
      <p>點單字卡可以聽發音喔！</p>
    </div>
    <div class="chips">
      <button class="chip ${cat === 'all' ? 'on' : ''}" onclick="go('cards','all')">🌈 全部</button>
      ${Object.entries(CATS).map(([k, c]) =>
        `<button class="chip ${cat === k ? 'on' : ''}" onclick="go('cards','${k}')">${c.emoji} ${c.label}</button>`
      ).join('')}
    </div>
    <div class="word-grid">
      ${list.map(w => {
        const m = masteryOf(w.id);
        return `
        <button class="word-card" onclick="speak('${esc(w.en)}'); sfx.pop();">
          ${profile.showNo && w.no ? `<div class="wno">#${w.no}</div>` : ''}
          <div class="we">${w.emoji}</div>
          <div class="wen">${esc(w.en)}</div>
          <div class="wzh">${w.zh}</div>
          ${w.note ? `<div class="wnote">${esc(w.note)}</div>` : ''}
          <div class="wstars">${'⭐'.repeat(m)}${'☆'.repeat(3 - m)}</div>
        </button>`;
      }).join('')}
    </div>
    <div class="btn-row">
      <button class="btn" onclick="go('setup','quiz')">去玩快問快答 🎯</button>
      <button class="btn secondary" onclick="go('home')">回首頁 🏠</button>
    </div>
  `);
}

/* ===== 14. 啟動：先選使用者 ===== */
renderEntry();
</script>
